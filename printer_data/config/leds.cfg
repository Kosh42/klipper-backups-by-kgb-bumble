[led white]
white_pin: PB15
cycle_time: 0.010
#   The amount of time (in seconds) per PWM cycle. It is recommended
#   this be 10 milliseconds or greater when using software based PWM.
#   The default is 0.010 seconds.
#hardware_pwm: False
#   Enable this to use hardware PWM instead of software PWM. When
#   using hardware PWM the actual cycle time is constrained by the
#   implementation and may be significantly different than the
#   requested cycle_time. The default is False.
initial_WHITE: 0.25


# You will need to configure a neopixel (or other addressable led, such as dotstar). See
# https://www.klipper3d.org/Config_Reference.html#neopixel for configuration details.
# And you can get sb led MACRO here: https://github.com/PrinterConfigs/DoomConfig/blob/master/stealthburner.cfg
# Or here https://github.com/sttts/voron-klipper-config/blob/master/stealthburner_leds.cfg

[neopixel rgbleds]
pin: PITB:gpio19
chain_count: 24
color_order: GRB
initial_RED: 0.89
initial_GREEN: 0.59
initial_BLUE: 0.0
#initial_WHITE: 0.2

[led_effect panel_idle]
autostart:              true
frame_rate:             24
leds:
    neopixel:rgbleds
layers:
    breathing  10 1 top (.9,.6,0)