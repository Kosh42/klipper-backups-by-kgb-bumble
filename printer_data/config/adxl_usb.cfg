[mcu adxl_usb]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6625C48930F6723-if00
restart_method: command
is_non_critical: True

[adxl345]
cs_pin: adxl_usb:gpio9
spi_software_sclk_pin: adxl_usb:gpio10
spi_software_mosi_pin: adxl_usb:gpio11
spi_software_miso_pin: adxl_usb:gpio12

[resonance_tester]
accel_chip: adxl345
probe_points:
    150,150, 20

[input_shaper]
shaper_freq_x: 68.0
shaper_freq_y: 75.6
shaper_type_x: mzv
shaper_type_y: 2hump_ei
damping_ratio_x: 0.050
damping_ratio_y: 0.070