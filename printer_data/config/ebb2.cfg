# This file contains common pin mappings for the BIGTREETECH EBB36
# GEN2 board. To use this config, the firmware should be compiled for the
# STM32G0B1 with "8 MHz crystal" and "USB (on PA11/PA12)" or "CAN bus (on PB12/PB13)" .
# The "EBB36 GEN2" micro-controller will be used to control the components on the nozzle.

# See docs/Config_Reference.md for a description of parameters.

[mcu EBB]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2A0007001850304158373620-if00

[temperature_sensor EBB36]
sensor_type: Generic 3950
sensor_pin: EBB:PA0
pullup_resistor: 2200

[lis2dw]
cs_pin: EBB:PB1
spi_bus:spi2_PB2_PB11_PB10
axes_map: x,y,z

[extruder]
step_pin: EBB:PB14
dir_pin: EBB:PA8
enable_pin: !EBB:PB6

# From Orbiter 2
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 4.625960864 #4.69
nozzle_diameter: 0.40                            #define nozzle diameter
filament_diameter: 1.750
max_extrude_only_distance: 500
max_extrude_only_velocity: 120
pressure_advance: 0.040                         #to be calibrated
pressure_advance_smooth_time: 0.03     #to be calibrated
#microsteps: 16
#rotation_distance: 33.500
#nozzle_diameter: 0.400
#filament_diameter: 1.750
heater_pin: EBB:PB4
sensor_type: PT1000 #EPCOS 100K B57560G104F
pullup_resistor: 2200
sensor_pin: EBB:PA3
control: pid
pid_Kp: 24.828
pid_Ki: 2.010
pid_Kd: 76.658
min_temp: 0
max_temp: 300

[tmc2209 extruder]
uart_pin: EBB:PB3
run_current: 0.650
stealthchop_threshold: 999999
sense_resistor: 0.110

#[filament_switch_sensor fil_det]
#switch_pin: EBB:PB5 #PD0

[multi_pin extruder_partfan_pins]
pins: EBB:PD3, EBB:PA5

[fan]
pin: multi_pin:extruder_partfan_pins

[heater_fan hotend_fan]
pin: EBB:PD2
tachometer_pin: EBB:PA4
heater: extruder
heater_temp: 50.0

# [neopixel hotend_rgb]
# pin: EBB:PC7

#[bltouch]
#sensor_pin: ^!EBB:PB8
#control_pin: EBB:PB5

#[output_pin rled]
#pin:EBB:PA2

#[temperature_sensor BME280]
#sensor_type: BME280
#i2c_mcu: EBB
##i2c_bus: i2c3_PA7_PA6
#i2c_software_scl_pin: EBB:PA7
#i2c_software_sda_pin: EBB:PA6

#endstop_pin: EBB:PA15
#diag_pin: ^EBB:PD1

[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevD_2F118075515137474C202020FF0C2925-if00
x_offset: 0 # update with offset from nozzle on your machine
y_offset: -20 # update with offset from nozzle on your machine
#mesh_main_direction: x
mesh_runs: 2

contact_max_hotend_temperature: 250 # increase to probe at print temps
home_xy_position: 150,150 # update with your safe position
home_z_hop: 5
home_z_hop_speed: 120 #30
home_xy_move_speed: 500
home_method: proximity # use proximity for induction homing
home_method_when_homed: proximity # after initial calibration use induction
home_autocalibrate: unhomed # contact will calibrate beacon on first home

